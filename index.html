<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>UPSC CSE Daily Pulse & Knowledge Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b0f19 100%);
      --surface-glass: rgba(17, 24, 39, 0.75);
      --border-color: rgba(55, 65, 81, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --gs1-color: #f59e0b; --gs1-bg: rgba(245, 158, 11, 0.18); --gs1-border: rgba(245, 158, 11, 0.4);
      --gs2-color: #3b82f6; --gs2-bg: rgba(59, 130, 246, 0.18); --gs2-border: rgba(59, 130, 246, 0.4);
      --gs3-color: #10b981; --gs3-bg: rgba(16, 185, 129, 0.18); --gs3-border: rgba(16, 185, 129, 0.4);
      --gs4-color: #a855f7; --gs4-bg: rgba(168, 85, 247, 0.18); --gs4-border: rgba(168, 85, 247, 0.4);
    }

    body {
      background: var(--bg-gradient); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; padding: 1.5rem 1rem; line-height: 1.5;
    }
    .container { max-width: 1240px; margin: 0 auto; }
    
    /* Header Navbar */
    .app-navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.5rem; background: var(--surface-glass); border: 1px solid var(--border-color);
      border-radius: 1rem; backdrop-filter: blur(12px); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .brand-group { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, #0284c7, #6366f1);
      border-radius: 0.625rem; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.15rem; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.75rem; color: #38bdf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .nav-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .mode-tab {
      background: rgba(31, 41, 55, 0.7); color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
    }
    .mode-tab:hover { background: #374151; color: #fff; }
    .mode-tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(2, 132, 199, 0.3); }

    .btn-pdf {
      background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .btn-pdf:hover { background: rgba(16, 185, 129, 0.25); border-color: #34d399; }

    /* Control & Search Bar Section */
    .search-panel {
      background: var(--surface-glass); border: 1px solid var(--border-color);
      padding: 1.25rem; border-radius: 1rem; margin-bottom: 2rem; backdrop-filter: blur(12px);
    }
    .search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .search-box {
      flex: 1; min-width: 280px; padding: 0.85rem 1.25rem; border-radius: 0.625rem;
      border: 1px solid var(--border-color); background: rgba(11, 15, 25, 0.85);
      color: #ffffff; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    .filter-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .pill {
      background: rgba(31, 41, 55, 0.6); color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 0.4rem 0.9rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s;
    }
    .pill:hover { background: #374151; color: #fff; }
    .pill.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .search-stats { font-size: 0.8rem; color: #38bdf8; font-weight: 600; margin-left: auto; }

    /* Featured Hero Section */
    .hero-card {
      display: grid; grid-template-columns: 1fr; gap: 1.5rem; background: var(--surface-glass);
      border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 1.25rem; overflow: hidden;
      margin-bottom: 2.5rem; cursor: pointer; transition: transform 0.25s;
    }
    @media (min-width: 768px) { .hero-card { grid-template-columns: 1.2fr 1fr; } }
    .hero-card:hover { transform: translateY(-3px); }
    .hero-img-container { width: 100%; height: 100%; min-height: 250px; background: #0b0f19; overflow: hidden; }
    .hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-body { padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between; }

    /* Grid Layout */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.75rem; }
    
    .card {
      background: var(--surface-glass); border: 1px solid var(--border-color);
      border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: all 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.6); }

    .card-img-wrapper { width: 100%; height: 180px; overflow: hidden; background: #0b0f19; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-body { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .card-header { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.55rem; border-radius: 0.375rem; text-transform: uppercase; }
    
    .badge-GS-1 { background: var(--gs1-bg); color: var(--gs1-color); border: 1px solid var(--gs1-border); }
    .badge-GS-2 { background: var(--gs2-bg); color: var(--gs2-color); border: 1px solid var(--gs2-border); }
    .badge-GS-3 { background: var(--gs3-bg); color: var(--gs3-color); border: 1px solid var(--gs3-border); }
    .badge-GS-4 { background: var(--gs4-bg); color: var(--gs4-color); border: 1px solid var(--gs4-border); }

    .badge-date { background: #090d16; color: var(--text-muted); border: 1px solid var(--border-color); font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    .badge-topic { background: #374151; color: #e5e7eb; font-size: 0.75rem; font-weight: 500; padding: 0.25rem 0.55rem; border-radius: 0.25rem; }
    .badge-static { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.3); font-size: 0.725rem; padding: 0.2rem 0.45rem; border-radius: 0.25rem; }

    .card-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; margin-bottom: 0.85rem; line-height: 1.4; }

    .section-title { font-size: 0.725rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .prelims-title { color: #fbbf24; }
    .mains-title { color: #34d399; }

    .box { background: rgba(11, 15, 25, 0.75); border: 1px solid rgba(55, 65, 81, 0.6); padding: 0.75rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem; color: #d1d5db; margin-bottom: 0.85rem; }
    .box ul { list-style-type: none; }
    .box li { margin-bottom: 0.35rem; line-height: 1.4; }

    .mains-box p { margin-bottom: 0.4rem; font-size: 0.85rem; color: #d1d5db; }
    .mains-box strong { color: #f9fafb; font-weight: 600; }

    .expand-hint { text-align: right; font-size: 0.775rem; color: #38bdf8; margin-top: 0.5rem; font-weight: 600; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-body {
      background: #111827; border: 1px solid var(--border-color); border-radius: 1.25rem;
      max-width: 740px; width: 100%; position: relative; max-height: 85vh; overflow-y: auto; overflow-x: hidden;
    }
    .modal-padding { padding: 1.75rem; }
    .close-btn {
      position: absolute; top: 1.25rem; right: 1.25rem; background: rgba(31, 41, 55, 0.8); border: 1px solid var(--border-color);
      color: #ffffff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .search-panel, .app-navbar, .expand-hint, .close-btn { display: none !important; }
      .grid, .hero-card { display: block !important; }
      .card { background: #ffffff !important; border: 1px solid #ccc !important; color: #000000 !important; margin-bottom: 2rem !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Executive Header Navbar -->
    <nav class="app-navbar">
      <div class="brand-group">
        <div class="brand-icon">CSE</div>
        <div>
          <div class="brand-title">UPSC IAS Daily Pulse</div>
          <div class="brand-sub">Daily Feed & Consolidated Knowledge Base</div>
        </div>
      </div>

      <div class="nav-actions">
        <button onclick="switchViewMode('DAILY')" id="tab-daily" class="mode-tab active">📰 Today's Feed</button>
        <button onclick="switchViewMode('REPO')" id="tab-repo" class="mode-tab">📚 Full Knowledge Base</button>
        <button onclick="switchViewMode('SAVED')" id="tab-saved" class="mode-tab">⭐ Saved Notes</button>
        <button onclick="window.print()" class="btn-pdf">🖨️ Export PDF</button>
      </div>
    </nav>

    <!-- Deep Search Controls -->
    <div class="search-panel">
      <div class="search-row">
        <input type="text" id="search-input" onkeyup="handleSearch()" class="search-box" placeholder="Type ANY keyword (e.g., UNCLOS, FRBM, Ethics, Speaker, ISRO, Agriculture, Monetary Policy)..." />
      </div>
      
      <div class="filter-pills">
        <button onclick="filterPaper('ALL')" class="pill active">All Syllabus</button>
        <button onclick="filterPaper('GS-1')" class="pill">GS-1 Culture & History</button>
        <button onclick="filterPaper('GS-2')" class="pill">GS-2 Polity & IR</button>
        <button onclick="filterPaper('GS-3')" class="pill">GS-3 Economy & Security</button>
        <button onclick="filterPaper('GS-4')" class="pill">GS-4 Ethics & Integrity</button>
        <span id="match-count" class="search-stats"></span>
      </div>
    </div>

    <div id="hero-container"></div>
    <div id="news-container" class="grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 4rem 0;">Loading current affairs & knowledge base...</div>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-body" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="close-btn">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let dailyNews = [];
    let staticRepo = [];
    let combinedPool = [];
    let currentMode = 'DAILY'; // 'DAILY', 'REPO', 'SAVED'
    let currentPaperFilter = 'ALL';
    let savedBookmarks = JSON.parse(localStorage.getItem('upsc_bookmarks') || '[]');

    const fallbackImages = {
      'GS-1': 'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?w=800&auto=format&fit=crop&q=60',
      'GS-2': 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60',
      'GS-3': 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&auto=format&fit=crop&q=60',
      'GS-4': 'https://images.unsplash.com/photo-1450133064473-71024230f91b?w=800&auto=format&fit=crop&q=60'
    };

    function handleImgError(imgElement, paperTag) {
      imgElement.onerror = null;
      imgElement.src = fallbackImages[paperTag] || fallbackImages['GS-2'];
    }

    function toggleBookmark(e, title) {
      e.stopPropagation();
      if (savedBookmarks.includes(title)) {
        savedBookmarks = savedBookmarks.filter(t => t !== title);
      } else {
        savedBookmarks.push(title);
      }
      localStorage.setItem('upsc_bookmarks', JSON.stringify(savedBookmarks));
      applyFilters();
    }

    async function fetchPayloads() {
      const container = document.getElementById('news-container');
      try {
        const [newsRes, repoRes] = await Promise.allSettled([
          fetch('./current_affairs.json?t=' + Date.now()).then(r => r.json()),
          fetch('./repository.json?t=' + Date.now()).then(r => r.json())
        ]);

        dailyNews = newsRes.status === 'fulfilled' && Array.isArray(newsRes.value) ? newsRes.value : [];
        staticRepo = repoRes.status === 'fulfilled' && Array.isArray(repoRes.value) ? repoRes.value : [];

        // Deduplicate and combine payloads safely
        const seen = new Set();
        combinedPool = [];

        [...dailyNews, ...staticRepo].forEach(item => {
          if (item && item.title) {
            const key = item.title.toLowerCase().trim();
            if (!seen.has(key)) {
              seen.add(key);
              combinedPool.push(item);
            }
          }
        });

        applyFilters();
      } catch (error) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 4rem 0;">Unable to load data payload.</div>`;
      }
    }

    function renderNews(items) {
      const heroContainer = document.getElementById('hero-container');
      const container = document.getElementById('news-container');
      const countEl = document.getElementById('match-count');
      heroContainer.innerHTML = '';
      container.innerHTML = '';

      if (countEl) countEl.textContent = `${items.length} Modules Available`;

      if (!items || items.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 4rem 0;">No UPSC modules match your search query. Try typing keywords like 'UNCLOS', 'FRBM', 'ISRO', 'Heritage', 'ARC', or 'Ethics'.</div>`;
        return;
      }

      const isSearchActive = document.getElementById('search-input').value.trim().length > 0;
      if (currentMode === 'DAILY' && currentPaperFilter === 'ALL' && !isSearchActive && items.length > 0) {
        const lead = items[0];
        const paperTag = lead.paper || 'GS-2';
        const itemDate = lead.date || 'Today';
        const prelimsList = (lead.prelims_pointers || []).map(p => `<li>• ${p}</li>`).join('');

        const hero = document.createElement('div');
        hero.className = "hero-card";
        hero.onclick = () => openModal(lead);
        hero.innerHTML = `
          <div class="hero-img-container">
            <img src="${lead.image || fallbackImages[paperTag]}" class="hero-img" alt="Lead News" onerror="handleImgError(this, '${paperTag}')" />
          </div>
          <div class="hero-body">
            <div>
              <div class="card-header">
                <span class="badge badge-${paperTag}">Featured Story • ${paperTag}</span>
                <span class="badge-date">${itemDate}</span>
                <span class="badge-topic">${lead.topic || 'Geopolitics'}</span>
                ${lead.static_linkage ? `<span class="badge-static">📚 ${lead.static_linkage}</span>` : ''}
              </div>
              <h2 style="font-size:1.6rem; font-weight:800; color:#fff; margin-bottom:1rem; line-height:1.3;">${lead.title}</h2>
              <div class="section-title prelims-title">Prelims Key Facts</div>
              <div class="box"><ul>${prelimsList}</ul></div>
            </div>
            <div class="expand-hint">Click to read full analytical module &rarr;</div>
          </div>
        `;
        heroContainer.appendChild(hero);
      }

      const gridItems = (currentMode === 'DAILY' && currentPaperFilter === 'ALL' && !isSearchActive) ? items.slice(1) : items;

      gridItems.forEach((item) => {
        const prelimsList = (item.prelims_pointers || []).map(p => `<li>• ${p}</li>`).join('');
        const itemDate = item.date || 'Today';
        const paperTag = item.paper || 'GS-1';
        const isSaved = savedBookmarks.includes(item.title);

        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openModal(item);
        
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${item.image || fallbackImages[paperTag]}" class="card-img" alt="News Image" onerror="handleImgError(this, '${paperTag}')" />
          </div>
          <div class="card-body">
            <div>
              <div class="card-header">
                <span class="badge badge-${paperTag}">${paperTag}</span>
                <span class="badge-date">${itemDate}</span>
                <span class="badge-topic">${item.topic || 'General'}</span>
                ${item.static_linkage ? `<span class="badge-static">📚 ${item.static_linkage}</span>` : ''}
              </div>
              <h2 class="card-title">${item.title}</h2>
              
              <div class="section-title prelims-title">Prelims Pointers</div>
              <div class="box"><ul>${prelimsList}</ul></div>

              ${item.mains_perspective ? `
              <div class="section-title mains-title">Mains Perspective</div>
              <div class="box mains-box">
                <p><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
                <p><strong>Key Arguments:</strong> ${item.mains_perspective.key_arguments || ''}</p>
                <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
              </div>` : ''}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem;">
              <button onclick="toggleBookmark(event, '${(item.title || '').replace(/'/g, "\\'")}')" class="mode-tab" style="padding:0.3rem 0.6rem; font-size:0.75rem;">${isSaved ? '⭐ Saved' : '☆ Save Note'}</button>
              <div class="expand-hint">Click to expand &rarr;</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(item) {
      const modal = document.getElementById('detail-modal');
      const modalContent = document.getElementById('modal-content');
      const itemDate = item.date || 'Today';
      const paperTag = item.paper || 'GS-1';
      const imgSrc = item.image || fallbackImages[paperTag];
      const prelimsList = (item.prelims_pointers || []).map(p => `<li style="margin-bottom:0.5rem;">• ${p}</li>`).join('');

      modalContent.innerHTML = `
        <div style="height:220px; overflow:hidden;">
          <img src="${imgSrc}" style="width:100%; height:100%; object-fit:cover;" onerror="handleImgError(this, '${paperTag}')" />
        </div>
        <div class="modal-padding">
          <div style="display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; margin-bottom:0.85rem;">
            <span class="badge badge-${paperTag}">${paperTag}</span>
            <span class="badge-date">${itemDate}</span>
            <span class="badge-topic">${item.topic}</span>
            ${item.static_linkage ? `<span class="badge-static">📚 ${item.static_linkage}</span>` : ''}
          </div>
          <h2 style="font-size:1.6rem; font-weight:800; color:#ffffff; margin-bottom:1.25rem; line-height:1.35;">${item.title}</h2>
          
          <div class="section-title prelims-title" style="font-size:0.85rem; margin-bottom:0.5rem;">Prelims Pointers</div>
          <div class="box" style="padding:1.15rem;"><ul style="list-style:none;">${prelimsList}</ul></div>

          ${item.mains_perspective ? `
          <div class="section-title mains-title" style="font-size:0.85rem; margin-bottom:0.5rem; margin-top:1.25rem;">Mains Perspective</div>
          <div class="box mains-box" style="padding:1.15rem;">
            <p style="margin-bottom:0.75rem;"><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
            <p style="margin-bottom:0.75rem;"><strong>Key Arguments:</strong> ${item.mains_perspective.key_arguments || ''}</p>
            <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
          </div>` : ''}
        </div>
      `;
      modal.classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'detail-modal' || e.target.className === 'close-btn') {
        document.getElementById('detail-modal').classList.remove('active');
      }
    }

    function switchViewMode(mode) {
      currentMode = mode;
      document.getElementById('tab-daily').classList.toggle('active', mode === 'DAILY');
      document.getElementById('tab-repo').classList.toggle('active', mode === 'REPO');
      document.getElementById('tab-saved').classList.toggle('active', mode === 'SAVED');
      
      if (mode === 'REPO') {
        document.getElementById('search-input').focus();
      }
      applyFilters();
    }

    function filterPaper(paper) {
      currentPaperFilter = paper;
      const buttons = document.querySelectorAll('.pill');
      buttons.forEach(btn => {
        if (btn.textContent.includes(paper) || (paper === 'ALL' && btn.textContent.includes('All Syllabus'))) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      applyFilters();
    }

    function handleSearch() { applyFilters(); }

    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      
      let activePool = [];
      if (currentMode === 'DAILY') {
        activePool = dailyNews.length > 0 ? dailyNews : combinedPool;
      } else if (currentMode === 'REPO') {
        activePool = combinedPool;
      } else if (currentMode === 'SAVED') {
        activePool = combinedPool.filter(item => savedBookmarks.includes(item.title));
      }

      if (currentPaperFilter !== 'ALL') {
        activePool = activePool.filter(item => item.paper === currentPaperFilter);
      }

      if (searchTerm.length > 0) {
        if (currentMode === 'DAILY') activePool = combinedPool;

        activePool = activePool.filter(item => {
          const titleMatch = (item.title || '').toLowerCase().includes(searchTerm);
          const topicMatch = (item.topic || '').toLowerCase().includes(searchTerm);
          const paperMatch = (item.paper || '').toLowerCase().includes(searchTerm);
          const staticMatch = (item.static_linkage || '').toLowerCase().includes(searchTerm);
          
          const prelimsMatch = item.prelims_pointers && item.prelims_pointers.some(p => p.toLowerCase().includes(searchTerm));
          
          let mainsMatch = false;
          if (item.mains_perspective) {
            mainsMatch = (item.mains_perspective.context || '').toLowerCase().includes(searchTerm) ||
                         (item.mains_perspective.key_arguments || '').toLowerCase().includes(searchTerm) ||
                         (item.mains_perspective.way_forward || '').toLowerCase().includes(searchTerm);
          }

          return titleMatch || topicMatch || paperMatch || staticMatch || prelimsMatch || mainsMatch;
        });
      }

      renderNews(activePool);
    }

    fetchPayloads();
  </script>
</body>
</html>
