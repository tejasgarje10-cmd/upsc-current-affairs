<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPSC Syllabus-Aligned Daily Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 0.5rem; color: #ffffff; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; }
    
    /* Search & Filter Controls */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .search-box {
      width: 100%; max-width: 500px; padding: 0.75rem 1rem;
      border-radius: 0.5rem; border: 1px solid #334155;
      background-color: #1e293b; color: #ffffff; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #38bdf8; }

    .filter-bar { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;
      font-weight: 500; font-size: 0.875rem; transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background-color: #0284c7; color: #ffffff; border-color: #38bdf8;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; }
    
    .card {
      background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .card:hover { border-color: #38bdf8; transform: translateY(-3px); }
    
    .card-img { width: 100%; height: 160px; object-fit: cover; background-color: #0f172a; }
    .card-body { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .card-header { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .badge-paper {
      background-color: rgba(14, 165, 233, 0.2); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.75rem;
      font-weight: 700; padding: 0.2rem 0.4rem; border-radius: 0.375rem;
    }
    .badge-date {
      background-color: #0f172a; color: #38bdf8; border: 1px solid #334155;
      font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    }
    .badge-topic {
      background-color: #334155; color: #cbd5e1; font-size: 0.75rem;
      padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    }
    
    .card-title { font-size: 1.15rem; font-weight: 600; color: #ffffff; margin-bottom: 0.85rem; line-height: 1.4; }
    
    .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .prelims-title { color: #fbbf24; }
    .mains-title { color: #34d399; }
    
    .box { background-color: #0f172a; border: 1px solid #1e293b; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.85rem; }
    .box ul { list-style-type: none; }
    .box li { margin-bottom: 0.35rem; }
    
    .mains-box p { margin-bottom: 0.4rem; font-size: 0.85rem; color: #cbd5e1; }
    .mains-box strong { color: #f8fafc; }
    
    .expand-hint { text-align: right; font-size: 0.75rem; color: #38bdf8; margin-top: 0.5rem; font-weight: 500; }
    
    /* Modal Styling */
    .modal-overlay {
      position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-body {
      background-color: #1e293b; border: 1px solid #475569; border-radius: 1rem;
      max-width: 700px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto;
    }
    .modal-img { width: 100%; height: 220px; object-fit: cover; }
    .modal-padding { padding: 1.75rem; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); border: none; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>UPSC Syllabus-Aligned Current Affairs</h1>
      <p class="subtitle">Comprehensive daily coverage: Geopolitics, Economy, Governance, Environment, & Ethics</p>
    </header>

    <div class="controls">
      <input type="text" id="search-input" onkeyup="handleSearch()" class="search-box" placeholder="Search topics (e.g., Geopolitics, UNCLOS, DPI, Ethics)..." />
      
      <div class="filter-bar">
        <button onclick="filterNews('ALL')" class="filter-btn active">All Papers</button>
        <button onclick="filterNews('GS-1')" class="filter-btn">GS-1</button>
        <button onclick="filterNews('GS-2')" class="filter-btn">GS-2</button>
        <button onclick="filterNews('GS-3')" class="filter-btn">GS-3</button>
        <button onclick="filterNews('GS-4')" class="filter-btn">GS-4</button>
      </div>
    </div>

    <div id="news-container" class="grid">
      <div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem 0;">Loading comprehensive current affairs...</div>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-body" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="close-btn">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let allNews = [];
    let currentPaperFilter = 'ALL';

    async function fetchNews() {
      const container = document.getElementById('news-container');
      try {
        const response = await fetch('./current_affairs.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('JSON file not found');
        allNews = await response.json();
        renderNews(allNews);
      } catch (error) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 3rem 0;">Error loading current affairs payload.</div>`;
      }
    }

    function renderNews(items) {
      const container = document.getElementById('news-container');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem 0;">No topics match your query.</div>`;
        return;
      }

      items.forEach((item, index) => {
        const prelimsList = (item.prelims_pointers || []).map(p => `<li>• ${p}</li>`).join('');
        const itemDate = item.date || new Date().toISOString().split('T')[0];
        const imageUrl = item.image || "[https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60)";

        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openModal(index);
        
        card.innerHTML = `
          <img src="${imageUrl}" class="card-img" alt="News Image" onerror="this.src='[https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60)'" />
          <div class="card-body">
            <div>
              <div class="card-header">
                <span class="badge-paper">${item.paper || 'GS'}</span>
                <span class="badge-date">${itemDate}</span>
                <span class="badge-topic">${item.topic || 'General'}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
              
              <div class="section-title prelims-title">Prelims Pointers</div>
              <div class="box"><ul>${prelimsList}</ul></div>

              ${item.mains_perspective ? `
              <div class="section-title mains-title">Mains Perspective</div>
              <div class="box mains-box">
                <p><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
                <p><strong>Key Takeaways:</strong> ${item.mains_perspective.key_arguments || ''}</p>
                <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
              </div>` : ''}
            </div>
            <div class="expand-hint">Click card to expand view &rarr;</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(index) {
      const item = allNews[index];
      const modal = document.getElementById('detail-modal');
      const modalContent = document.getElementById('modal-content');
      const itemDate = item.date || new Date().toISOString().split('T')[0];
      const imageUrl = item.image || "[https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60)";

      const prelimsList = (item.prelims_pointers || []).map(p => `<li style="margin-bottom:0.5rem; color:#f1f5f9;">• ${p}</li>`).join('');

      modalContent.innerHTML = `
        <img src="${imageUrl}" class="modal-img" alt="Modal Header" onerror="this.src='[https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60)'" />
        <div class="modal-padding">
          <div style="display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; margin-bottom:0.85rem;">
            <span class="badge-paper">${item.paper}</span>
            <span class="badge-date">${itemDate}</span>
            <span class="badge-topic">${item.topic}</span>
          </div>
          <h2 style="font-size:1.5rem; font-weight:700; color:#ffffff; margin-bottom:1.25rem; line-height:1.3;">${item.title}</h2>
          
          <div class="section-title prelims-title" style="font-size:0.85rem; margin-bottom:0.5rem;">Prelims Pointers</div>
          <div class="box" style="padding:1rem;"><ul style="list-style:none;">${prelimsList}</ul></div>

          ${item.mains_perspective ? `
          <div class="section-title mains-title" style="font-size:0.85rem; margin-bottom:0.5rem;">Mains Perspective</div>
          <div class="box mains-box" style="padding:1rem;">
            <p style="margin-bottom:0.5rem;"><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
            <p style="margin-bottom:0.5rem;"><strong>Key Takeaways:</strong> ${item.mains_perspective.key_arguments || ''}</p>
            <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
          </div>` : ''}
        </div>
      `;
      modal.classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'detail-modal' || e.target.className === 'close-btn') {
        document.getElementById('detail-modal').classList.remove('active');
      }
    }

    function filterNews(paper) {
      currentPaperFilter = paper;
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        if (btn.textContent.trim() === paper || (paper === 'ALL' && btn.textContent.trim() === 'All Papers')) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      let filtered = allNews;

      if (currentPaperFilter !== 'ALL') {
        filtered = filtered.filter(item => item.paper === currentPaperFilter);
      }

      if (searchTerm) {
        filtered = filtered.filter(item => 
          item.title.toLowerCase().includes(searchTerm) ||
          item.topic.toLowerCase().includes(searchTerm) ||
          (item.prelims_pointers && item.prelims_pointers.some(p => p.toLowerCase().includes(searchTerm))) ||
          (item.mains_perspective && item.mains_perspective.context.toLowerCase().includes(searchTerm))
        );
      }

      renderNews(filtered);
    }

    fetchNews();
  </script>
</body>
</html>
