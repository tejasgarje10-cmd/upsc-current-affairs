<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPSC Syllabus-Aligned Current Affairs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 0.5rem; color: #ffffff; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; }
    
    .filter-bar { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .filter-btn {
      background-color: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .badge-paper {
      background-color: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
    }
    .badge-topic { background-color: #334155; color: #94a3b8; font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    
    .card-title { font-size: 1.25rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; line-height: 1.4; }
    
    .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .prelims-title { color: #fbbf24; }
    .mains-title { color: #34d399; }
    
    .box { background-color: #0f172a; border: 1px solid #1e293b; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1rem; }
    .box ul { list-style-type: none; }
    .box li { margin-bottom: 0.35rem; }
    .box li:last-child { margin-bottom: 0; }
    
    .mains-box p { margin-bottom: 0.4rem; font-size: 0.85rem; color: #cbd5e1; }
    .mains-box p:last-child { margin-bottom: 0; }
    .mains-box strong { color: #f8fafc; }
    
    .expand-hint { text-align: right; font-size: 0.75rem; color: #38bdf8; margin-top: 0.5rem; font-weight: 500; }
    
    /* Modal Styling */
    .modal-overlay {
      position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.8);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-body {
      background-color: #1e293b; border: 1px solid #475569; border-radius: 1rem;
      max-width: 650px; width: 100%; padding: 1.75rem; position: relative; max-height: 90vh; overflow-y: auto;
    }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #ffffff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>UPSC Syllabus-Aligned Current Affairs</h1>
      <p class="subtitle">Daily news categorized by General Studies papers with Prelims facts & Mains perspectives</p>
    </header>

    <div class="filter-bar">
      <button onclick="filterNews('ALL')" class="filter-btn active">All Papers</button>
      <button onclick="filterNews('GS-1')" class="filter-btn">GS-1</button>
      <button onclick="filterNews('GS-2')" class="filter-btn">GS-2</button>
      <button onclick="filterNews('GS-3')" class="filter-btn">GS-3</button>
      <button onclick="filterNews('GS-4')" class="filter-btn">GS-4</button>
    </div>

    <div id="news-container" class="grid">
      <div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem 0;">Loading daily current affairs...</div>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-body" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="close-btn">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let allNews = [];

    async function fetchNews() {
      const container = document.getElementById('news-container');
      try {
        const response = await fetch('./current_affairs.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('JSON file not found');
        allNews = await response.json();
        renderNews(allNews);
      } catch (error) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 3rem 0;">Error loading current affairs payload.</div>`;
      }
    }

    function renderNews(items) {
      const container = document.getElementById('news-container');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem 0;">No items available for this filter.</div>`;
        return;
      }

      items.forEach((item, index) => {
        const prelimsList = (item.prelims_pointers || []).map(p => `<li>• ${p}</li>`).join('');
        
        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openModal(index);
        
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="badge-paper">${item.paper || 'GS'}</span>
              <span class="badge-topic">${item.topic || 'General'}</span>
            </div>
            <h2 class="card-title">${item.title}</h2>
            
            <div class="section-title prelims-title">Prelims Pointers</div>
            <div class="box"><ul>${prelimsList}</ul></div>

            ${item.mains_perspective ? `
            <div class="section-title mains-title">Mains Perspective</div>
            <div class="box mains-box">
              <p><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
              <p><strong>Key Takeaways:</strong> ${item.mains_perspective.key_arguments || ''}</p>
              <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
            </div>` : ''}
          </div>
          <div class="expand-hint">Click card to expand view &rarr;</div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(index) {
      const item = allNews[index];
      const modal = document.getElementById('detail-modal');
      const modalContent = document.getElementById('modal-content');

      const prelimsList = (item.prelims_pointers || []).map(p => `<li style="margin-bottom:0.5rem; color:#f1f5f9;">• ${p}</li>`).join('');

      modalContent.innerHTML = `
        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem;">
          <span class="badge-paper">${item.paper}</span>
          <span class="badge-topic">${item.topic}</span>
        </div>
        <h2 style="font-size:1.5rem; font-weight:700; color:#ffffff; margin-bottom:1.25rem; line-height:1.3;">${item.title}</h2>
        
        <div class="section-title prelims-title" style="font-size:0.85rem; margin-bottom:0.5rem;">Prelims Pointers</div>
        <div class="box" style="padding:1rem;"><ul style="list-style:none;">${prelimsList}</ul></div>

        ${item.mains_perspective ? `
        <div class="section-title mains-title" style="font-size:0.85rem; margin-bottom:0.5rem;">Mains Perspective</div>
        <div class="box mains-box" style="padding:1rem;">
          <p style="margin-bottom:0.5rem;"><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
          <p style="margin-bottom:0.5rem;"><strong>Key Takeaways:</strong> ${item.mains_perspective.key_arguments || ''}</p>
          <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
        </div>` : ''}
      `;
      modal.classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'detail-modal' || e.target.className === 'close-btn') {
        document.getElementById('detail-modal').classList.remove('active');
      }
    }

    function filterNews(paper) {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        if (btn.textContent.trim() === paper || (paper === 'ALL' && btn.textContent.trim() === 'All Papers')) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (paper === 'ALL') {
        renderNews(allNews);
      } else {
        const filtered = allNews.filter(item => item.paper === paper);
        renderNews(filtered);
      }
    }

    fetchNews();
  </script>
</body>
</html>
