<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NexusGS Workspace & Vision Evaluator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b0f19 100%);
      --surface-glass: rgba(17, 24, 39, 0.8);
      --border-color: rgba(55, 65, 81, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --gs1-color: #f59e0b; --gs1-bg: rgba(245, 158, 11, 0.18); --gs1-border: rgba(245, 158, 11, 0.4);
      --gs2-color: #3b82f6; --gs2-bg: rgba(59, 130, 246, 0.18); --gs2-border: rgba(59, 130, 246, 0.4);
      --gs3-color: #10b981; --gs3-bg: rgba(16, 185, 129, 0.18); --gs3-border: rgba(16, 185, 129, 0.4);
      --gs4-color: #a855f7; --gs4-bg: rgba(168, 85, 247, 0.18); --gs4-border: rgba(168, 85, 247, 0.4);
    }

    body {
      background: var(--bg-gradient); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; padding: 1.5rem 1rem; line-height: 1.5;
    }
    .container { max-width: 1240px; margin: 0 auto; }
    
    .app-navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.5rem; background: var(--surface-glass); border: 1px solid var(--border-color);
      border-radius: 1rem; backdrop-filter: blur(12px); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .brand-group { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 0.625rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.75rem; color: #38bdf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .nav-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .mode-tab {
      background: rgba(31, 41, 55, 0.7); color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
    }
    .mode-tab:hover { background: #374151; color: #fff; }
    .mode-tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(2, 132, 199, 0.3); }

    .btn-eval {
      background: rgba(168, 85, 247, 0.2); color: #e879f9; border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .btn-eval:hover { background: rgba(168, 85, 247, 0.35); }

    .search-panel {
      background: var(--surface-glass); border: 1px solid var(--border-color);
      padding: 1.25rem; border-radius: 1rem; margin-bottom: 2rem; backdrop-filter: blur(12px);
    }
    .search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .search-box {
      flex: 1; min-width: 280px; padding: 0.85rem 1.25rem; border-radius: 0.625rem;
      border: 1px solid var(--border-color); background: rgba(11, 15, 25, 0.85);
      color: #ffffff; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    .filter-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .pill {
      background: rgba(31, 41, 55, 0.6); color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 0.4rem 0.9rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s;
    }
    .pill:hover { background: #374151; color: #fff; }
    .pill.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .search-stats { font-size: 0.8rem; color: #38bdf8; font-weight: 600; margin-left: auto; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.75rem; }
    .card {
      background: var(--surface-glass); border: 1px solid var(--border-color);
      border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: all 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.6); }

    .card-img-wrapper { width: 100%; height: 180px; overflow: hidden; background: #0b0f19; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .card-header { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.55rem; border-radius: 0.375rem; text-transform: uppercase; }
    .badge-GS-1 { background: var(--gs1-bg); color: var(--gs1-color); border: 1px solid var(--gs1-border); }
    .badge-GS-2 { background: var(--gs2-bg); color: var(--gs2-color); border: 1px solid var(--gs2-border); }
    .badge-GS-3 { background: var(--gs3-bg); color: var(--gs3-color); border: 1px solid var(--gs3-border); }
    .badge-GS-4 { background: var(--gs4-bg); color: var(--gs4-color); border: 1px solid var(--gs4-border); }
    .badge-date { background: #090d16; color: var(--text-muted); border: 1px solid var(--border-color); font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    .badge-topic { background: #374151; color: #e5e7eb; font-size: 0.75rem; font-weight: 500; padding: 0.25rem 0.55rem; border-radius: 0.25rem; }

    .card-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; margin-bottom: 0.85rem; line-height: 1.4; }
    .section-title { font-size: 0.725rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .prelims-title { color: #fbbf24; }
    .mains-title { color: #34d399; }
    .box { background: rgba(11, 15, 25, 0.75); border: 1px solid rgba(55, 65, 81, 0.6); padding: 0.75rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem; color: #d1d5db; margin-bottom: 0.85rem; }
    .box ul { list-style-type: none; }
    .box li { margin-bottom: 0.35rem; line-height: 1.4; }
    .mains-box p { margin-bottom: 0.4rem; font-size: 0.85rem; color: #d1d5db; }
    .mains-box strong { color: #f9fafb; font-weight: 600; }
    .expand-hint { text-align: right; font-size: 0.775rem; color: #38bdf8; margin-top: 0.5rem; font-weight: 600; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-body {
      background: #111827; border: 1px solid var(--border-color); border-radius: 1.25rem;
      max-width: 740px; width: 100%; position: relative; max-height: 85vh; overflow-y: auto; overflow-x: hidden;
    }
    .modal-padding { padding: 1.75rem; }
    .close-btn {
      position: absolute; top: 1.25rem; right: 1.25rem; background: rgba(31, 41, 55, 0.8); border: 1px solid var(--border-color);
      color: #ffffff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .btn-ai {
      background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; border: none;
      padding: 0.75rem 1.5rem; border-radius: 0.625rem; font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    
    <nav class="app-navbar">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"></path>
            <path d="M4 20L21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">NexusGS</div>
          <div class="brand-sub">UPSC Knowledge Base & Vision Grader</div>

      <div class="nav-actions">
        <button onclick="switchViewMode('DAILY')" id="tab-daily" class="mode-tab active">📰 Feed</button>
        <button onclick="switchViewMode('REPO')" id="tab-repo" class="mode-tab">📚 Repository</button>
        <button onclick="switchViewMode('SAVED')" id="tab-saved" class="mode-tab">⭐ Saved</button>

    <div class="search-panel">

      </div>
      
      <div class="filter-pills">
        <button onclick="filterPaper('ALL')" class="pill active">All Syllabus</button>
        <button onclick="filterPaper('GS-1')" class="pill">GS-1 Culture</button>
        <button onclick="filterPaper('GS-2')" class="pill">GS-2 Polity & IR</button>
        <button onclick="filterPaper('GS-3')" class="pill">GS-3 Economy</button>
        <button onclick="filterPaper('GS-4')" class="pill">GS-4 Ethics</button>

    <div id="ai-banner-container"></div>
    <div id="news-container" class="grid">

    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-body" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="close-btn">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- AI Vision Answer Evaluator Modal -->
  <div id="evaluator-modal" class="modal-overlay" onclick="closeEvaluator(event)">
    <div class="modal-body" onclick="event.stopPropagation()" style="max-width: 640px;">
      <button onclick="closeEvaluator()" class="close-btn">&times;</button>
      <div class="modal-padding">
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">📸 AI Vision Answer Grader</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Upload a photo of your handwritten answer sheet (10-marker or 15-marker). Gemini Vision will read your handwriting and grade it instantly!</p>
        
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
          <div style="flex: 1;">
            <label style="font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Paper:</label>
            <select id="eval-paper" class="search-box" style="width: 100%; margin-top: 0.3rem;">
              <option value="GS-1">GS-1</option>
              <option value="GS-2" selected>GS-2</option>
              <option value="GS-3">GS-3</option>
              <option value="GS-4">GS-4</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Marker Type:</label>
            <select id="eval-type" class="search-box" style="width: 100%; margin-top: 0.3rem;">
              <option value="10-Marker (150 Words)">10-Marker (150 Words)</option>
              <option value="15-Marker (250 Words)" selected>15-Marker (250 Words)</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Question Prompt:</label>
          <input type="text" id="eval-question" class="search-box" style="width: 100%; margin-top: 0.3rem;" placeholder="e.g., Examine the role of UNCLOS in maritime security..." />
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Upload Answer Sheet Photo:</label>
          <input type="file" id="eval-image" accept="image/*" class="search-box" style="width: 100%; margin-top: 0.3rem; padding: 0.6rem;" />
        </div>

        <button onclick="evaluateHandwrittenAnswer()" class="btn-ai" style="width: 100%;">Grade Handwritten Answer with Vision AI</button>
        <div id="eval-result" style="margin-top: 1.25rem;"></div>
      </div>
    </div>
  </div>

  <script>
    const CORE_REPOSITORY = [
      {
        "title": "Cooperative Federalism vs. Aggressive Fiscal Centralization",
        "paper": "GS-2",
        "topic": "Indian Polity & Federal Structure",
        "static_linkage": "Centre-State Relations (Article 245-263)",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "Inter-State Council operates under Article 263 as a recommendatory body.",
          "GST Council is a constitutional body under Article 279A.",
          "Sarkaria and Punchhi Commissions examined the strengthening of cooperative federalism."
        ],
        "mains_perspective": {
          "context": "Rising friction between the Union and opposition-ruled states over cess/surcharges, Governor's role, and legislative incursions.",
          "key_arguments": "Excessive reliance on cesses dilutes the divisible pool of taxes under the Finance Commission recommendations, starving states of fiscal autonomy.",
          "way_forward": "Institutionalize regular meetings of the Inter-State Council and adhere strictly to Sarkaria Commission guidelines on gubernatorial discretion."
        }
      },
      {
        "title": "Secularism, Uniform Civil Code (UCC) & Constitutional Morality",
        "paper": "GS-2",
        "topic": "Indian Constitution & Polity",
        "static_linkage": "Article 25-28 & Article 44 (DPSP)",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "Article 44 directs the State to secure a Uniform Civil Code throughout India.",
          "Freedom of religion under Article 25 is subject to public order, morality, and health."
        ],
        "mains_perspective": {
          "context": "Balancing the mandate of a unified legal code with the protection of cultural and religious pluralism in a diverse democracy.",
          "key_arguments": "While UCC promotes gender justice and legal uniformity, forced implementation without broad-based consensus can fracture social capital.",
          "way_forward": "Adopt a gradual, consultative reform approach—amending discriminatory practices within personal laws first before pushing for a monolithic code."
        }
      },
      {
        "title": "Inclusive Growth, K-Shaped Recovery & Agrarian Distress",
        "paper": "GS-3",
        "topic": "Indian Economy & Inclusive Growth",
        "static_linkage": "Growth, Development and Employment",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "MSME sector contributes nearly 30% to India's GDP and 40% to exports.",
          "PM-KISAN provides income support of Rs 6,000 per year to landholding farmer families."
        ],
        "mains_perspective": {
          "context": "Macroeconomic GDP growth numbers outpacing wage growth and rural consumption recovery.",
          "key_arguments": "High corporate profitability coexists with stagnant rural wages and high youth unemployment, pointing to structural distortions.",
          "way_forward": "Shift focus from capital-intensive manufacturing subsidies to labor-intensive sectors (textiles, food processing) and climate-resilient agriculture."
        }
      },
      {
        "title": "AI Ethics, Algorithmic Bias & Deepfakes Regulation",
        "paper": "GS-3",
        "topic": "Science & Tech - Emerging Tech",
        "static_linkage": "IT Act & National AI Strategy",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "IndiaAI Mission focuses on computing infrastructure and sovereign AI models.",
          "IT Rules, 2021 mandate social media intermediaries to take down synthetic content within stipulated hours."
        ],
        "mains_perspective": {
          "context": "Explosive growth of generative AI posing severe threats to electoral integrity, privacy, and national security.",
          "key_arguments": "Unchecked algorithmic bias exacerbates social discrimination while deepfakes undermine public trust in democratic institutions.",
          "way_forward": "Enact a robust Digital India Act with mandatory watermarking for synthetic media and algorithmic transparency audits."
        }
      },
      {
        "title": "Bureaucratic Ethics, Lateral Entry & Whistleblower Protection",
        "paper": "GS-4",
        "topic": "Ethics in Public Administration",
        "static_linkage": "Civil Services Accountability & Probity",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1521791136064-7986c2920216?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "Second ARC 4th Report focuses extensively on ethics in governance.",
          "Whistleblowers Protection Act provides legal mechanisms to safeguard informants against victimization."
        ],
        "mains_perspective": {
          "context": "Navigating the tension between political executive directives, professional neutrality, and adherence to constitutional conscience.",
          "key_arguments": "Anonymity and neutrality are often compromised by systemic political pressure and lack of statutory job security.",
          "way_forward": "Implement 2nd ARC recommendations: establish Civil Services Boards for transparent postings and operationalize robust whistleblower safeguards."
        }
      },
      {
        "title": "Internal Security Challenges: Left Wing Extremism (LWE) & Nexus",
        "paper": "GS-3",
        "topic": "Internal Security & Border Management",
        "static_linkage": "Security Challenges in Border Areas",
        "date": "2026-10",
        "image": "https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=60",
        "prelims_pointers": [
          "Security Related Expenditure (SRE) scheme assists LWE-affected states.",
          "Aspirational Districts Programme targets socio-economic backwardness in LWE corridors."
        ],
        "mains_perspective": {
          "context": "Geographical shrinking of LWE influence accompanied by challenges in developmental governance in remote pockets.",
          "key_arguments": "Kinetic military operations alone cannot resolve an ideological conflict rooted in land alienation and tribal marginalization.",
          "way_forward": "Combine security dominance with aggressive infrastructure push (roads, mobile connectivity) and land rights regularization under FRA, 2006."
        }
      }
    ];

    let combinedPool = [...CORE_REPOSITORY];
    let currentMode = 'DAILY';
    let currentPaperFilter = 'ALL';
    let savedBookmarks = JSON.parse(localStorage.getItem('upsc_bookmarks') || '[]');

    const fallbackImages = {
      'GS-1': 'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?w=800&auto=format&fit=crop&q=60',
      'GS-2': 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=800&auto=format&fit=crop&q=60',
      'GS-3': 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&auto=format&fit=crop&q=60',
      'GS-4': 'https://images.unsplash.com/photo-1450133064473-71024230f91b?w=800&auto=format&fit=crop&q=60'
    };

    function handleImgError(imgElement, paperTag) {
      imgElement.onerror = null;
      imgElement.src = fallbackImages[paperTag] || fallbackImages['GS-2'];
    }

    function openEvaluator() { document.getElementById('evaluator-modal').classList.add('active'); }
    function closeEvaluator(e) {
      if (!e || e.target.id === 'evaluator-modal' || e.target.className === 'close-btn') document.getElementById('evaluator-modal').classList.remove('active');
    }

    function compressImageAndConvertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_WIDTH = 1200;
            const MAX_HEIGHT = 1200;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    }

    async function evaluateHandwrittenAnswer() {
      const paper = document.getElementById('eval-paper').value;
      const markerType = document.getElementById('eval-type').value;
      const question = document.getElementById('eval-question').value.trim();
      const fileInput = document.getElementById('eval-image');
      const resultDiv = document.getElementById('eval-result');

      if (!question) { alert('Please enter the question prompt.'); return; }
      if (fileInput.files.length === 0) { alert('Please upload a photo of your handwritten answer sheet.'); return; }

      resultDiv.innerHTML = `<div style="color:#38bdf8; text-align:center; padding:1rem;">Compressing image & contacting AI Grader...</div>`;

      try {
        const base64Data = await compressImageAndConvertToBase64(fileInput.files[0]);

        const res = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            paper,
            markerType,
            imageBase64: base64Data,
            mimeType: 'image/jpeg'
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `Server error code: ${res.status}`);
        }

        resultDiv.innerHTML = `<div class="box" style="margin-top:1rem; max-height:300px; overflow-y:auto; padding:1rem; color:#f3f4f6;">${data.feedback}</div>`;
      } catch (err) {
        resultDiv.innerHTML = `<div style="color:#f87171; text-align:center; padding:0.5rem;"><strong>Error:</strong> ${err.message || 'Network request failed.'}</div>`;
      }
    }

    function toggleBookmark(e, title) {
      e.stopPropagation();
      savedBookmarks = savedBookmarks.includes(title) ? savedBookmarks.filter(t => t !== title) : [...savedBookmarks, title];
      localStorage.setItem('upsc_bookmarks', JSON.stringify(savedBookmarks));
      applyFilters();
    }

    async function initApp() {
      try {
        const [newsRes, repoRes] = await Promise.allSettled([
          fetch('./current_affairs.json?t=' + Date.now()).then(r => r.json()),
          fetch('./repository.json?t=' + Date.now()).then(r => r.json())
        ]);
        const merged = [...(newsRes.value || []), ...(repoRes.value || []), ...CORE_REPOSITORY];
        const seen = new Set(); combinedPool = [];
        merged.forEach(item => {
          if (item && item.title) {
            const key = item.title.toLowerCase().trim();
            if (!seen.has(key)) { seen.add(key); combinedPool.push(item); }
          }
        });
      } catch (err) {}
      applyFilters();
    }

    function renderNews(items) {
      const bannerContainer = document.getElementById('ai-banner-container');
      const container = document.getElementById('news-container');
      bannerContainer.innerHTML = ''; container.innerHTML = '';
      document.getElementById('match-count').textContent = `${items.length} Modules`;

      if (!items || items.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 4rem 0;">No matching modules found in repository.</div>`;
        return;
      }

      items.forEach((item) => {
        const prelimsList = (item.prelims_pointers || []).map(p => `<li>• ${p}</li>`).join('');
        const paperTag = item.paper || 'GS-2';
        const isSaved = savedBookmarks.includes(item.title);

        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="card-img-wrapper"><img src="${item.image || fallbackImages[paperTag]}" class="card-img" onerror="handleImgError(this, '${paperTag}')" /></div>
          <div class="card-body">
            <div>
              <div class="card-header">
                <span class="badge badge-${paperTag}">${paperTag}</span>
                <span class="badge-date">${item.date || '2026-10'}</span>
                <span class="badge-topic">${item.topic || item.static_linkage || 'General'}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
              <div class="section-title prelims-title">Prelims Pointers</div>
              <div class="box"><ul>${prelimsList}</ul></div>
              ${item.mains_perspective ? `
              <div class="section-title mains-title">Mains Perspective</div>
              <div class="box mains-box">
                <p><strong>Context:</strong> ${item.mains_perspective.context || ''}</p>
                <p><strong>Key Arguments:</strong> ${item.mains_perspective.key_arguments || ''}</p>
                <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward || ''}</p>
              </div>` : ''}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem;">
              <button onclick="toggleBookmark(event, '${(item.title || '').replace(/'/g, "\\'")}')" class="mode-tab" style="padding:0.3rem 0.6rem; font-size:0.75rem;">${isSaved ? '⭐ Saved' : '☆ Save'}</button>
              <div class="expand-hint">Expand &rarr;</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(item) {
      const modal = document.getElementById('detail-modal');
      const paperTag = item.paper || 'GS-2';
      const prelimsList = (item.prelims_pointers || []).map(p => `<li style="margin-bottom:0.5rem;">• ${p}</li>`).join('');
      document.getElementById('modal-content').innerHTML = `
        <div style="height:200px; overflow:hidden;"><img src="${item.image || fallbackImages[paperTag]}" style="width:100%; height:100%; object-fit:cover;" onerror="handleImgError(this, '${paperTag}')" /></div>
        <div class="modal-padding">
          <div style="display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; margin-bottom:0.75rem;">
            <span class="badge badge-${paperTag}">${paperTag}</span>
            <span class="badge-date">${item.date || '2026-10'}</span>
            <span class="badge-topic">${item.topic || item.static_linkage || ''}</span>
          </div>
          <h2 style="font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:1rem;">${item.title}</h2>
          <div class="section-title prelims-title">Prelims Pointers</div>
          <div class="box" style="padding:1rem;"><ul>${prelimsList}</ul></div>
          ${item.mains_perspective ? `
          <div class="section-title mains-title" style="margin-top:1rem;">Mains Perspective</div>
          <div class="box mains-box" style="padding:1rem;">
            <p style="margin-bottom:0.5rem;"><strong>Context:</strong> ${item.mains_perspective.context}</p>
            <p style="margin-bottom:0.5rem;"><strong>Key Arguments:</strong> ${item.mains_perspective.key_arguments}</p>
            <p><strong>Way Forward:</strong> ${item.mains_perspective.way_forward}</p>
          </div>` : ''}
        </div>
      `;
      modal.classList.add('active');
    }
    function closeModal(e) { if (!e || e.target.id === 'detail-modal' || e.target.className === 'close-btn') document.getElementById('detail-modal').classList.remove('active'); }

    function switchViewMode(mode) {
      currentMode = mode;
      document.getElementById('tab-daily').classList.toggle('active', mode === 'DAILY');
      document.getElementById('tab-repo').classList.toggle('active', mode === 'REPO');
      document.getElementById('tab-saved').classList.toggle('active', mode === 'SAVED');
      applyFilters();
    }
    function filterPaper(paper) {
      currentPaperFilter = paper;
      document.querySelectorAll('.pill').forEach(btn => btn.classList.toggle('active', btn.textContent.includes(paper) || (paper === 'ALL' && btn.textContent.includes('All'))));
      applyFilters();
    }
    function handleSearch() { applyFilters(); }

    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      let activePool = combinedPool;

      if (currentMode === 'SAVED') {
        activePool = activePool.filter(item => savedBookmarks.includes(item.title));
      }
      if (currentPaperFilter !== 'ALL') {
        activePool = activePool.filter(item => item.paper === currentPaperFilter);
      }
      if (searchTerm.length > 0) {
        activePool = activePool.filter(item => {
          const title = (item.title || '').toLowerCase();
          const topic = (item.topic || '').toLowerCase();
          const linkage = (item.static_linkage || '').toLowerCase();
          const context = (item.mains_perspective && item.mains_perspective.context || '').toLowerCase();
          return title.includes(searchTerm) || topic.includes(searchTerm) || linkage.includes(searchTerm) || context.includes(searchTerm);
        });
      }
      renderNews(activePool);
    }

    initApp();
  </script>
</body>
</html>
