name: UPSC Current Affairs Daily Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'   # 07:30 AM IST
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Run Fetch and AI Classification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_classify.py

      - name: Commit and push current affairs payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add current_affairs.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update UPSC current affairs [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main
          else
            echo "No changes in current_affairs.json to commit."
          fi
